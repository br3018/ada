# SysML v2 Pilot API server backed by PostgreSQL.
# Start it from inside the dev container with `make api-up` (see the Makefile for the other commands).
name: sysml-api

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sysml2
      POSTGRES_USER: postgres
      # Must match the credentials baked into the upstream persistence.xml
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sysml2"]
      interval: 5s
      retries: 20

  api:
    build:
      # The repository root, so the build can read the pilot release from sysml-versions.env
      context: ..
      dockerfile: sysml-api/Dockerfile
    ports:
      - "9000:9000"
    environment:
      PLAY_SECRET: "dev-only-not-a-secret-change-me-for-anything-shared"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
