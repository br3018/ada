# SysML v2 Pilot API server backed by PostgreSQL.
# Run from inside the dev container: docker compose -f sysml-api/compose.yaml up -d --build
name: sysml-api

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sysml2
      POSTGRES_USER: postgres
      # Must match the credentials baked into the upstream persistence.xml
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sysml2"]
      interval: 5s
      retries: 20

  api:
    build:
      context: .
      args:
        SYSML_RELEASE: "2026-04"
    ports:
      - "9000:9000"
    environment:
      PLAY_SECRET: "dev-only-not-a-secret-change-me-for-anything-shared"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
