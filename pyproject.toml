[project]
name = "ada"
version = "0.1.0"
description = "A development environment for carrying out system design and verification using SysML v2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
# The project is not a Python package. uv only manages the Python version and the virtual environment.
package = false
# Use only the Python that uv downloads. The Ubuntu python3.x-minimal does not have the full standard library.
python-preference = "only-managed"
